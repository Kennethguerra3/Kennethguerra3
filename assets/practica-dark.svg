<svg xmlns="http://www.w3.org/2000/svg" width="860" height="188" viewBox="0 0 860 188" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif"><style>.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-variant-numeric:tabular-nums}</style><clipPath id="c"><rect x=".5" y=".5" width="859" height="187" rx="6"/></clipPath><g clip-path="url(#c)"><rect width="860" height="188" fill="#0d1117"/><g transform="translate(32,26)" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></g><text x="262" y="43" fill="#8b949e" font-size="12" font-weight="400" text-anchor="end" class="m">01</text><text x="32" y="84" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="start">BI y analítica operativa</text><text x="32" y="108" fill="#8b949e" font-size="13" font-weight="400" text-anchor="start">Pipelines ETL/ELT, modelado y Power</text><text x="32" y="127" fill="#8b949e" font-size="13" font-weight="400" text-anchor="start">BI a escala. Tableros que se</text><text x="32" y="146" fill="#8b949e" font-size="13" font-weight="400" text-anchor="start">refrescan solos y hablan el idioma</text><text x="32" y="165" fill="#8b949e" font-size="13" font-weight="400" text-anchor="start">del negocio.</text><line x1="286.5" y1="0" x2="286.5" y2="188" stroke="#30363d"/><g transform="translate(310,26)" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></g><text x="548" y="43" fill="#8b949e" font-size="12" font-weight="400" text-anchor="end" class="m">02</text><text x="310" y="84" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="start">Ingeniería comercial</text><text x="310" y="108" fill="#8b949e" font-size="13" font-weight="400" text-anchor="start">Sell-out, rotación, forecasting y</text><text x="310" y="127" fill="#8b949e" font-size="13" font-weight="400" text-anchor="start">KPIs accionables para las áreas</text><text x="310" y="146" fill="#8b949e" font-size="13" font-weight="400" text-anchor="start">comercial, de planeamiento y de</text><text x="310" y="165" fill="#8b949e" font-size="13" font-weight="400" text-anchor="start">finanzas.</text><line x1="573.5" y1="0" x2="573.5" y2="188" stroke="#30363d"/><g transform="translate(597,26)" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></g><text x="835" y="43" fill="#8b949e" font-size="12" font-weight="400" text-anchor="end" class="m">03</text><text x="597" y="84" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="start">Inteligencia territorial</text><text x="597" y="108" fill="#8b949e" font-size="13" font-weight="400" text-anchor="start">Geomarketing, geolocalización de</text><text x="597" y="127" fill="#8b949e" font-size="13" font-weight="400" text-anchor="start">negocios y optimización de rutas de</text><text x="597" y="146" fill="#8b949e" font-size="13" font-weight="400" text-anchor="start">venta con GIS para la operación en</text><text x="597" y="165" fill="#8b949e" font-size="13" font-weight="400" text-anchor="start">campo.</text></g><rect x=".5" y=".5" width="859" height="187" rx="6" fill="none" stroke="#30363d"/></svg>