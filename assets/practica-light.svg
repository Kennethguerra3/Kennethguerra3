chor="start">precios e inventarios.</text><line x1="573.5" y1="0" x2="573.5" y2="188" stroke="#d0d7de"/><g transform="translate(597,26)" fill="none" stroke="#0969da" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:1.2s"><path class="draw" style="animation-delay:1.4s" pathLength="1" d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></g><text x="835" y="43" fill="#59636e" font-size="12" font-weight="400" text-anchor="end" class="m">03</text><text x="597" y="84" fill="#1f2328" font-size="15" font-weight="600" text-anchor="start">Inteligencia territorial</text><text x="597" y="108" fill="#59636e" font-size="13" font-weight="400" text-anchor="start">Geolocalización, segmentación de</text><text x="597" y="127" fill="#59636e" font-size="13" font-weight="400" text-anchor="start">cartera y planificación de rutas de</text><text x="597" y="146" fill="#59636e" font-size="13" font-weight="400" text-anchor="start">venta a nivel nacional.</text></g><rect x=".5" y=".5" width="859" height="187" rx="6" fill="none" stroke="#d0d7de"/></svg>