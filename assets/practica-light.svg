<svg xmlns="http://www.w3.org/2000/svg" width="860" height="188" viewBox="0 0 860 188" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif"><style>.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-variant-numeric:tabular-nums}
.draw{animation:draw 9s ease-in-out infinite}@keyframes draw{0%{stroke-dasharray:1;stroke-dashoffset:1}22%,100%{stroke-dasharray:1;stroke-dashoffset:0}}
.up{transform-box:fill-box;transform-origin:bottom;animation:up 9s cubic-bezier(.16,1,.3,1) infinite}@keyframes up{0%{transform:scaleY(0)}14%,100%{transform:scaleY(1)}}
.gx{transform-box:fill-box;transform-origin:left;animation:gx 1.4s cubic-bezier(.16,1,.3,1) both}@keyframes gx{from{transform:scaleX(0)}}
.in{animation:in .9s ease-out both}@keyframes in{from{opacity:0;transform:translateY(6px)}}
