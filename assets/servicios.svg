<svg xmlns="http://www.w3.org/2000/svg" width="860" height="180" viewBox="0 0 860 180" font-family="Segoe UI,Ubuntu,Helvetica,Arial,sans-serif">
<style>.p{animation:p 2.4s ease-in-out infinite}@keyframes p{0%,100%{opacity:.25}50%{opacity:1}}.d{stroke-dasharray:6 8;animation:d 1.6s linear infinite}@keyframes d{to{stroke-dashoffset:-28}}.bar{transform-box:fill-box;transform-origin:left;animation:g 1.2s ease-out both}@keyframes g{from{transform:scaleX(0)}to{transform:scaleX(1)}}</style>
<defs></defs>
<rect x="2" y="2" width="276" height="176" rx="14" fill="#0F172A" stroke="#1E3A5F" stroke-width="1.5"/><circle cx="36" cy="38" r="14" fill="#38BDF8" opacity=".18"/><circle cx="36" cy="38" r="6" fill="#38BDF8"/><text x="24" y="82" fill="#F8FAFC" font-size="17" font-weight="700">BI y Analytics Engineering</text><text x="24" y="108" fill="#A8B8CC" font-size="13">Pipelines ETL/ELT, modelado y Power</text><text x="24" y="127" fill="#A8B8CC" font-size="13">BI a escala. Tableros que se</text><text x="24" y="146" fill="#A8B8CC" font-size="13">refrescan solos y hablan el idioma</text><text x="24" y="165" fill="#A8B8CC" font-size="13">del negocio.</text><rect x="292" y="2" width="276" height="176" rx="14" fill="#0F172A" stroke="#1E3A5F" stroke-width="1.5"/><circle cx="326" cy="38" r="14" fill="#7DD3FC" opacity=".18"/><circle cx="326" cy="38" r="6" fill="#7DD3FC"/><text x="314" y="82" fill="#F8FAFC" font-size="17" font-weight="700">Inteligencia territorial</text><text x="314" y="108" fill="#A8B8CC" font-size="13">Geomarketing, geolocalización de</text><text x="314" y="127" fill="#A8B8CC" font-size="13">negocios y optimización de rutas de</text><text x="314" y="146" fill="#A8B8CC" font-size="13">venta con GIS para subir la</text><text x="314" y="165" fill="#A8B8CC" font-size="13">rentabilidad en campo.</text><rect x="582" y="2" width="276" height="176" rx="14" fill="#0F172A" stroke="#1E3A5F" stroke-width="1.5"/><circle cx="616" cy="38" r="14" fill="#60A5FA" opacity=".18"/><circle cx="616" cy="38" r="6" fill="#60A5FA"/><text x="604" y="82" fill="#F8FAFC" font-size="17" font-weight="700">Inteligencia comercial</text><text x="604" y="108" fill="#A8B8CC" font-size="13">Sell-out, rotación, forecasting y</text><text x="604" y="127" fill="#A8B8CC" font-size="13">KPIs accionables para las áreas</text><text x="604" y="146" fill="#A8B8CC" font-size="13">comercial, de planeamiento y de</text><text x="604" y="165" fill="#A8B8CC" font-size="13">finanzas.</text>
</svg>